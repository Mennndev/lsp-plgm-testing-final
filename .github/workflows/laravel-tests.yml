name: Laravel Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Test Laravel Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil source code
        uses: actions/checkout@v6

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependency Composer
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Buat file environment
        run: cp .env.example .env

      - name: Buat application key
        run: php artisan key:generate

      - name: Bersihkan cache Laravel
        run: |
          php artisan config:clear
          php artisan cache:clear

      - name: Siapkan Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependency frontend
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Jalankan migration pengujian
        run: php artisan migrate --force

      - name: Jalankan Laravel test
        run: php artisan test --colors=always
