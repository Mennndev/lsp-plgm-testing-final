name: Laravel Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  laravel-tests:
    name: Test Laravel Application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lsp_plgm_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_DEBUG: true

      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lsp_plgm_testing
      DB_USERNAME: root
      DB_PASSWORD: root

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Ambil branch PR
        uses: actions/checkout@v6
        with:
          ref: agent/fix-core-audit-and-tests

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, xml, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependency Composer
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Buat file environment
        run: cp .env.example .env

      - name: Buat application key
        run: php artisan key:generate

      - name: Bersihkan konfigurasi Laravel
        run: php artisan config:clear

      - name: Siapkan Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependency frontend
        run: npm ci

      - name: Perbaiki dependency frontend tanpa force
        run: npm audit fix

      - name: Verifikasi audit dependency
        run: npm audit --audit-level=moderate

      - name: Commit lockfile hasil perbaikan
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "Tidak ada perubahan dependency yang perlu dikomit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Fix npm dependency vulnerabilities"
            git push origin HEAD:agent/fix-core-audit-and-tests
          fi

      - name: Build frontend
        run: npm run build

      - name: Jalankan migration pengujian
        run: php artisan migrate:fresh --force

      - name: Jalankan Laravel test
        run: php artisan test --colors=always
